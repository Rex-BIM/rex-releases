name: Verify public Mac package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Mac release version
        required: true
        default: '0.9.7'

permissions:
  contents: read

jobs:
  verify:
    name: macOS ${{ matrix.os }} Apple Silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { os: '15', runner: macos-15 }
          - { os: '26', runner: macos-26 }
          - { os: '27', runner: xcode-27 }
    env:
      EXPECTED_MACOS_MAJOR: ${{ matrix.os }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify public ZIP, signature, provenance and notarization
        run: node scripts/verify-macos-release.mjs "$RELEASE_VERSION" "$RUNNER_TEMP/rex-compat"
      - name: Exercise the bundled tools and rendered model
        run: node scripts/smoke-macos.mjs "$RUNNER_TEMP/rex-compat/expanded/Rex Architect.app" "$RUNNER_TEMP/rex-compat/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-${{ matrix.os }}-package-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/rex-compat/package-verification.json
            ${{ runner.temp }}/rex-compat/results/runtime-verification.json
            ${{ runner.temp }}/rex-compat/results/sample-model.png
